name: activity

# Redraws the live panels (assets/activity*.svg and assets/hero*.svg) from the contribution calendar.
on:
  schedule:
    - cron: "41 6,18 * * *"   # twice a day (12:11 and 00:11 IST)
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    paths:
      - scripts/activity.py
      - scripts/console.py
      - scripts/hero.py
      - scripts/fonts/**
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Draw the activity panel
        run: python3 scripts/activity.py --user "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity*.svg assets/hero*.svg
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "activity: $(date -u +%F)"
          git push
