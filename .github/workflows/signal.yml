name: signal

# Redraws assets/signal-*.svg (wide and phone, both themes) from the contribution calendar.
on:
  schedule:
    - cron: "41 6,18 * * *"   # twice a day (12:11 and 00:11 IST)
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    paths:
      - scripts/signal.py
      - scripts/bitmap.py
      - .github/workflows/signal.yml

permissions:
  contents: write

concurrency:
  group: signal
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Draw the signal
        run: python3 scripts/signal.py --user "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the signal changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/signal-*.svg
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "signal: $(date -u +%F)"
          git push
