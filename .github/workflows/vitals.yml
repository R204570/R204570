name: vitals

# Redraws assets/vitals.svg (the commit-heartbeat monitor) from your contribution calendar.
on:
  schedule:
    - cron: "41 6,18 * * *"   # twice a day (12:11 and 00:11 IST)
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    paths:
      - scripts/vitals.py
      - .github/workflows/vitals.yml

permissions:
  contents: write

concurrency:
  group: vitals
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Draw the monitor
        run: python3 scripts/vitals.py --user "${{ github.repository_owner }}" --out assets/vitals.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the trace changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vitals.svg
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "vitals: $(date -u +%F)"
          git push
